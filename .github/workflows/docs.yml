name: Documentation

on:
  pull_request:
    paths:
      - ".readthedocs.yaml"
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/sync_wiki.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - main
    paths:
      - ".readthedocs.yaml"
      - "docs/**"
      - "mkdocs.yml"
      - "scripts/sync_wiki.py"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and validate
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools
        run: python -m pip install --requirement docs/requirements.txt

      - name: Build documentation
        run: python -m mkdocs build --strict

      - name: Validate Wiki rendering
        run: python scripts/sync_wiki.py "${RUNNER_TEMP}/peslite-wiki"

  sync-wiki:
    name: Publish GitHub Wiki
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation tools
        run: python -m pip install --requirement docs/requirements.txt

      - name: Checkout Wiki
        uses: actions/checkout@v6
        with:
          repository: "${{ github.repository }}.wiki"
          ref: master
          path: .wiki
          token: ${{ github.token }}

      - name: Render Wiki
        run: python scripts/sync_wiki.py .wiki

      - name: Commit and push Wiki changes
        working-directory: .wiki
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          git add --all
          if git diff --cached --quiet; then
            echo "Wiki is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync from PESLite ${SOURCE_SHA}"
          git push
